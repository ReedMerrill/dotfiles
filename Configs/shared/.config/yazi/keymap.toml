# toggle-pane
[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

# Bookmarks
[[mgr.prepend_keymap]]
on = [ "m" ]
run = "plugin bookmarks save"
desc = "Save current position as a bookmark"

[[mgr.prepend_keymap]]
on = [ "'" ]
run = "plugin bookmarks jump"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "d" ]
run = "plugin bookmarks delete"
desc = "Delete a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "D" ]
run = "plugin bookmarks delete_all"
desc = "Delete all bookmarks"

[[mgr.prepend_keymap]]
on  = "M"
run = "plugin mount"

# Copy file contents to the system clipboard (selected files, or the hovered one)
[[mgr.prepend_keymap]]
on   = [ "c", "y" ]
run  = 'shell -- for f in "$@"; do [ "$(file -b --mime-encoding "$f")" = binary ] && exit 1; done; cat "$@" | pbcopy'
desc = "Copy file contents to the system clipboard"
